# Local Postgres, shared by the whole repo — the server, `bin/sync_catalog` and the
# `#[sqlx::test]` suite all connect to it. It lives at the root rather than under
# apps/server for that reason: root describes the system, apps/<x>/ describes how
# one app is built.
#
# Creds here MUST match apps/server/.env DATABASE_URL.
#   docker compose up -d      # start
#   docker compose down       # stop (keeps volume)
#   docker compose down -v    # stop + wipe data
#
# Deliberately does not run the server itself: that would rebuild the image on
# every code change, which is a far worse inner loop than `cargo run`.
services:
  db:
    # Matches production: Neon serves Postgres 18. Migrations use 18-only
    # features (`uuidv7()`), so an older local server cannot apply them.
    image: postgres:18
    container_name: maiscope-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maiscope
    ports:
      - "5432:5432"
    volumes:
      # The 18 image keeps PGDATA in a versioned directory under this mount;
      # the 17-era volume at .../data is left as it was, unused.
      - maiscope-pgdata-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maiscope"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  maiscope-pgdata-18:
