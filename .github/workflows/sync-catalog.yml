name: sync-catalog

# Daily differential sync of the upstream catalog. Safe to run unattended
# because bin/sync_catalog never deletes and refuses implausible payloads
# before writing — see docs/work/catalog-sync/spec.md.
on:
  schedule:
    # 19:00 UTC = 02:00 Asia/Ho_Chi_Minh, off-peak for the primary region.
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    # `cancel-in-progress: false` above means every later run queues behind this
    # one, so a stalled job must not be allowed to sit on GitHub's 6-hour
    # default. Comfortably above bin/sync_catalog's own 900s run budget, which
    # covers the part that holds database locks; this only catches the rest
    # (checkout, a cold cargo build).
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native

      - name: Run the sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # --locked: this job writes to production, so it must build the
        # dependency set Cargo.lock pins, same as apps/server/Dockerfile insists.
        run: cargo run --release --locked --bin sync_catalog
