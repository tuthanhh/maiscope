name: docs

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-doc-links.mjs"
      - ".github/workflows/docs.yml"
  push:
    branches: [master]

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Markdown links
        run: node scripts/check-doc-links.mjs .
