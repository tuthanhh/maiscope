name: ci

on:
  pull_request:
  push:
    branches: [master]

# Deliberately no `paths:` filter, unlike docs.yml. A required status check that
# is skipped by a path filter never reports at all, and GitHub then blocks the
# merge forever waiting for it.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Native Rust: everything that ships as a server binary, plus the simai
  # parser it links.
  #
  # Scoped to `-p server -p simai` rather than `--workspace` on purpose. The
  # workspace also holds `engine` (Bevy), which would add ~300 crates, a
  # multi-gigabyte cache, and an apt install of ALSA/X11/Wayland headers.
  # And Cargo unifies features across every crate in one build: with `engine`
  # selected, `simai` would compile with its `bevy` feature on, putting
  # bevy_ecs into the server's graph. Never widen these steps to the workspace.
  rust:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18 # matches the root docker-compose.yml and Neon
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maiscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maiscope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/maiscope

    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml, so the version lives in one place.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native

      - name: cargo fmt
        run: cargo fmt --check

      # Only `sqlx prepare --check` needs a migrated database: `#[sqlx::test]`
      # creates a throwaway database per test and applies migrations itself.
      #
      # Migrations are applied by the same binary that runs as Fly's release
      # command, so CI exercises the deploy path rather than a second
      # implementation via `sqlx migrate run`.
      - name: Apply migrations
        run: cargo run --bin migrate

      # sqlx-cli is still required: `prepare --check` is one of its subcommands,
      # and bin/migrate only replaces `sqlx migrate run`.
      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      # Flags must match how .sqlx/ is generated (ticket 01), or this compiles a
      # different set of targets than the cache covers and calls it stale.
      #
      # `--workspace` selects the root-level cache; `-p server` restricts the
      # underlying `cargo check` to the only crate holding query macros. Without
      # `-p`, the check compiles `engine` natively and needs Bevy's ALSA/X11/
      # Wayland headers — which is exactly what this workflow avoids by linting
      # the engine on the wasm target instead.
      - name: Offline query cache is current
        run: cargo sqlx prepare --check --workspace -- -p server --all-targets

      - name: cargo clippy
        run: cargo clippy -p server -p simai --all-targets -- -D warnings

      # The server must never link Bevy (ADR-0014). Checked on the resolved
      # graph, so a feature switched on anywhere upstream is caught here.
      # The tree goes to a file first: in a pipe, a failing `cargo tree` would
      # print nothing, grep would find nothing, and the step would pass.
      - name: No Bevy in the server's graph
        run: |
          cargo tree -p server -e normal > server-tree.txt
          if grep -i bevy server-tree.txt; then
            echo "::error::Bevy is in the server's dependency graph (ADR-0014)"
            exit 1
          fi

      - name: cargo test
        run: cargo test -p server -p simai

  # The engine's own native tests: playback timing and guide sounds. The
  # parser tests moved to `crates/simai` and run in the `rust` job; what is
  # left here needs Bevy, so this job still pays for its headers and tree.
  #
  # Its own cache key, not `native` or `wasm`: sharing with `native` would grow
  # the server job's cache by Bevy's whole tree, and sharing with `wasm` would
  # mix two target triples in one cache.
  engine:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: engine-native

      # A native Bevy build needs all four: ALSA (bevy_kira_audio -> cpal),
      # libudev (winit's input probing), and wayland + xkbcommon, which
      # `wayland-sys` resolves through pkg-config at *build* time because
      # engine/Cargo.toml enables Bevy's `wayland` feature.
      - name: Install Bevy's native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: cargo test (engine)
        run: cargo test -p engine

  # The engine and the frontend are one job because they are one dependency
  # chain: `pnpm build` fails without the wasm bindings, since useEngine.ts
  # imports ~/wasm/engine.js and apps/host/src/wasm/ is gitignored.
  # Keeping them together also lets the clippy run's dependency rlibs feed the
  # wasm build from the same target/ directory, instead of shipping a ~140MB
  # artifact between two jobs.
  wasm-web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      # Must equal the wasm-bindgen crate version in engine/Cargo.toml exactly,
      # or bindgen fails on a schema mismatch.
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.122

      # Compiling is checking, so this also covers "does engine still build for
      # wasm" — no separate `cargo build --target ...` step is needed.
      - name: cargo clippy (engine, wasm target)
        run: cargo clippy -p engine --target wasm32-unknown-unknown -- -D warnings

      - name: Build wasm bindings
        run: ./scripts/build-wasm.sh

      - uses: pnpm/action-setup@v4
        with:
          # There is no root package.json; the version comes from the host app's
          # packageManager field.
          package_json_file: apps/host/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/host/pnpm-lock.yaml

      - name: pnpm install
        working-directory: apps/host
        run: pnpm install --frozen-lockfile

      # vue-tsc --noEmit && vite build
      - name: pnpm build
        working-directory: apps/host
        run: pnpm build
