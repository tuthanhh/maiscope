<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <defs>
    <linearGradient id="lensGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFF3D8"/>
      <stop offset="100%" stop-color="#CBEAF7"/>
    </linearGradient>
  </defs>

  <!-- magnifier handle (drawn first so the ring overlaps its base) -->
  <g transform="translate(169.41 164.41) rotate(45)">
    <rect x="-14" y="-12" width="86" height="24" rx="10" fill="#3B4A54"/>
  </g>

  <!-- ring, rotated 11.25deg (half a segment) -->
  <g transform="rotate(11.25 110 105)">
    <!-- outer button ring: neutral base -->
    <circle cx="110" cy="105" r="71" fill="none" stroke="#EDF1F4" stroke-width="26"/>

    <!-- outer button ring: blue segments (16 total) -->
    <circle cx="110" cy="105" r="71" fill="none" stroke="#57C7EE" stroke-width="26"
            stroke-dasharray="27.882 27.882"/>

    <!-- crisp edges on the ring -->
    <circle cx="110" cy="105" r="84.5" fill="none" stroke="#D8DEE4" stroke-width="1.5"/>
    <circle cx="110" cy="105" r="57.5" fill="none" stroke="#D8DEE4" stroke-width="1.5"/>
  </g>

  <!-- two accent dots, in the ring segment nearest the handle -->
  <circle cx="156.04" cy="145.02" r="1.5" fill="#8A939B"/>
  <circle cx="150.02" cy="151.04" r="1.5" fill="#8A939B"/>

  <!-- lens / play-area face -->
  <circle cx="110" cy="105" r="55" fill="url(#lensGradient)"/>
</svg>
