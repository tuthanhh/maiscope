[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = {workspace = true}
serde = {workspace = true}
serde_json = "1.0.150"
reqwest = "0.13.4"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "uuid", "json", "tls-rustls-ring-webpki"] }
tower-http = { version = "0.7.0", features = ["compression-br", "compression-gzip", "cors", "trace"] }
dotenvy = "0.15.7"
sha2 = "0.10"
unicode-normalization = "0.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum", "tracing"] }
governor = "0.10.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
